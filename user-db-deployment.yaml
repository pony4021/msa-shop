apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: user-db
  name: user-db
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: user-db
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: user-db
    spec:
      containers:
        - env:
            - name: POSTGRES_DB
              value: userdb
            - name: POSTGRES_PASSWORD
              value: user_db_password
            - name: POSTGRES_USER
              value: user
          image: postgres:16-alpine
          livenessProbe:
            exec:
              command:
                - pg_isready -U user -d userdb
            failureThreshold: 10
            periodSeconds: 10
            timeoutSeconds: 5
          name: user-db
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: user-db-data
      restartPolicy: Always
      volumes:
        - name: user-db-data
          persistentVolumeClaim:
            claimName: user-db-data
