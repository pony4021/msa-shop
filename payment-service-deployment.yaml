apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: payment-service
  name: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: payment-service
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: payment-service
    spec:
      containers:
        - env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://user:payment_db_password@payment-db:5432/paymentdb
            - name: INTERNAL_API_SECRET
              value: your-internal-api-secret-change-this
            - name: KAFKA_TOPIC_PAYMENT_CREATED
              value: payment-created
            - name: ORDER_SERVICE_URL
              value: http://order-service:8000
            - name: PAYMENT_SUCCESS_RATE
              value: "1.0"
            - name: USER_SERVICE_URL
              value: http://user-service:8000
          image: payment-service
          name: payment-service
          ports:
            - containerPort: 8000
              protocol: TCP
      restartPolicy: Always
