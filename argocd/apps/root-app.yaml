apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop-msa-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_ME/shop-msa.git
    targetRevision: main
    path: argocd/apps
    directory:
      recurse: true
      exclude: root-app.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
