map $http_referer $next_upstream {
    default http://frontend:3000;
    ~*://[^/]+/admin http://frontend-admin:3000;
}

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=10s;

    location = /health {
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    location /api/users/ {
        set $user_upstream http://user-service:8000;
        proxy_pass $user_upstream;
    }

    location /api/products/ {
        set $product_upstream http://product-service:8000;
        proxy_pass $product_upstream;
    }

    location /api/orders/ {
        set $order_upstream http://order-service:8000;
        proxy_pass $order_upstream;
    }

    location /api/inventory/ {
        set $inventory_upstream http://inventory-service:8000;
        proxy_pass $inventory_upstream;
    }

    location /api/payments/ {
        set $payment_upstream http://payment-service:8000;
        proxy_pass $payment_upstream;
    }

    location /api/payment-events/ {
        set $payment_event_upstream http://payment-event-service:8000;
        proxy_pass $payment_event_upstream;
    }

    location ^~ /admin {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://frontend-admin:3000;
    }

    location ^~ /_next/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $next_upstream;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://frontend:3000;
    }
}
