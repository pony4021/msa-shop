apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-msa-nginx-gateway-config
  namespace: shop-msa-app
data:
  default.conf: |
    map $http_referer $next_upstream {
        default http://frontend:3000;
        ~*://[^/]+/admin http://frontend-admin:3000;
    }

    server {
        listen 80;
        server_name _;

        location = /health {
            add_header Content-Type application/json;
            return 200 '{"status":"ok"}';
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
            return 204;
        }

        location /api/users/ {
            proxy_pass http://user-service:8000;
        }

        location /api/products/ {
            proxy_pass http://product-service:8000;
        }

        location /api/orders/ {
            proxy_pass http://order-service:8000;
        }

        location /api/inventory/ {
            proxy_pass http://inventory-service:8000;
        }

        location /api/payments/ {
            proxy_pass http://payment-service:8000;
        }

        location /api/payment-events/ {
            proxy_pass http://payment-event-service:8000;
        }

        location ^~ /admin {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_pass http://frontend-admin:3000;
        }

        location ^~ /_next/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass $next_upstream;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://frontend:3000;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: shop-msa-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: shop-msa-nginx-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: shop-msa-app
spec:
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80

