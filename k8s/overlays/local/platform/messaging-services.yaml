apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: shop-msa-app
spec:
  selector:
    io.kompose.service: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: shop-msa-app
spec:
  selector:
    io.kompose.service: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
