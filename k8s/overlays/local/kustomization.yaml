apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - platform/postgres.yaml
  - platform/messaging-services.yaml
  - platform/nginx-gateway.yaml

images:
  # Use registry images so Jenkins -> Argo CD can roll updates automatically on local clusters.
  - name: <aws_account_id>.dkr.ecr.ap-northeast-2.amazonaws.com/shop-msa/frontend
    newName: ghcr.io/pony4021/msa-shop/frontend
    newTag: 20260427-01
  - name: <aws_account_id>.dkr.ecr.ap-northeast-2.amazonaws.com/shop-msa/frontend-admin
    newName: ghcr.io/pony4021/msa-shop/frontend-admin
    newTag: 20260427-01
  - name: <aws_account_id>.dkr.ecr.ap-northeast-2.amazonaws.com/shop-msa/user-service
    newName: ghcr.io/pony4021/msa-shop/user-service
    newTag: 20260427-01
  - name: <aws_account_id>.dkr.ecr.ap-northeast-2.amazonaws.com/shop-msa/product-service
    newName: ghcr.io/pony4021/msa-shop/product-service
    newTag: 20260427-01
  - name: <aws_account_id>.dkr.ecr.ap-northeast-2.amazonaws.com/shop-msa/order-service
    newName: ghcr.io/pony4021/msa-shop/order-service
    newTag: 20260427-01
  - name: <aws_account_id>.dkr.ecr.ap-northeast-2.amazonaws.com/shop-msa/inventory-service
