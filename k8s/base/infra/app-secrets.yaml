apiVersion: v1
kind: Secret
metadata:
  name: shop-msa-app-secrets
  namespace: shop-msa-app
type: Opaque
stringData:
  JWT_SECRET_KEY: CHANGE_ME_JWT_SECRET
  INTERNAL_API_SECRET: CHANGE_ME_INTERNAL_SECRET
  ADMIN_EMAIL: admin@admin.com
  ADMIN_PASSWORD: adminadmin1234
  ADMIN_USERNAME: admin

  USER_DATABASE_URL: postgresql+asyncpg://shopmsa:CHANGE_ME_DB_PASSWORD@shop-msa-rds-endpoint:5432/userdb
  PRODUCT_DATABASE_URL: postgresql+asyncpg://shopmsa:CHANGE_ME_DB_PASSWORD@shop-msa-rds-endpoint:5432/productdb
  ORDER_DATABASE_URL: postgresql+asyncpg://shopmsa:CHANGE_ME_DB_PASSWORD@shop-msa-rds-endpoint:5432/orderdb
  INVENTORY_DATABASE_URL: postgresql+asyncpg://shopmsa:CHANGE_ME_DB_PASSWORD@shop-msa-rds-endpoint:5432/inventorydb
  PAYMENT_DATABASE_URL: postgresql+asyncpg://shopmsa:CHANGE_ME_DB_PASSWORD@shop-msa-rds-endpoint:5432/paymentdb
  PAYMENT_EVENT_DATABASE_URL: postgresql+asyncpg://shopmsa:CHANGE_ME_DB_PASSWORD@shop-msa-rds-endpoint:5432/paymenteventdb
