apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: shop-msa-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: <aws_account_id>.dkr.ecr.ap-northeast-2.amazonaws.com/shop-msa/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shop-msa-app-secrets
                  key: ORDER_DATABASE_URL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: shop-msa-app-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_TOPIC_ORDER_CREATED
              valueFrom:
                configMapKeyRef:
                  name: shop-msa-app-config
                  key: KAFKA_TOPIC_ORDER_CREATED
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: shop-msa-app-config
                  key: USER_SERVICE_URL
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: shop-msa-app-config
                  key: PRODUCT_SERVICE_URL
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: shop-msa-app-secrets
                  key: INTERNAL_API_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: shop-msa-app
spec:
  selector:
    app: order-service
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service
  namespace: shop-msa-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-service
  namespace: shop-msa-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: order-service
