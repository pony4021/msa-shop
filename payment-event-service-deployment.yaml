apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: payment-event-service
  name: payment-event-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: payment-event-service
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: payment-event-service
    spec:
      containers:
        - env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://user:payment_event_db_password@payment-event-db:5432/paymenteventdb
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: KAFKA_GROUP_ID
              value: payment-event-service
            - name: KAFKA_TOPIC_PAYMENT_CREATED
              value: payment-created
            - name: REDIS_URL
              value: redis://redis:6379
          image: payment-event-service
          name: payment-event-service
          ports:
            - containerPort: 8000
              protocol: TCP
      restartPolicy: Always
